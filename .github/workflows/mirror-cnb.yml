name: Mirror to CNB

on:
  push:
    branches: [carrot-byd]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: mirror-cnb
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # CNB 端已有完整镜像，这里只做增量同步：
      # 浅克隆后仅补齐当前 ref 的完整历史（不拉其他分支/标签），
      # 只推送触发本次运行的分支或 tag，且不带 --force（正常 fast-forward）
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Unshallow current ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --unshallow --no-tags origin "+${REF}"
          git fetch origin "+${REF}"

      - name: Push incrementally to CNB (no force)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/beldon-op/carrotpilot.git"
          git push "$REMOTE" "${REF}:${REF}" --progress
          echo "Incremental mirror of ${REF} completed."
